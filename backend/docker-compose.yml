services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketspace_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-marketspace}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-marketspace_app} -d ${POSTGRES_DB:-marketspace}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-marketspace_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-marketspace}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 40
      RESERVE_POOL_SIZE: 10
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'

  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - redis_queue_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketspace_app}:${POSTGRES_PASSWORD:-secretpassword}@pgbouncer:6432/${POSTGRES_DB:-marketspace}?schema=public&pgbouncer=true&connection_limit=10
      PGBOUNCER_ENABLED: 'true'
      DATABASE_CONNECTION_LIMIT: 10
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: 6379
      ENABLE_WORKERS: 'false'
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
    ports:
      - '3000:3000'
    depends_on:
      - pgbouncer
      - redis-cache
      - redis-queue
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketspace_app}:${POSTGRES_PASSWORD:-secretpassword}@pgbouncer:6432/${POSTGRES_DB:-marketspace}?schema=public&pgbouncer=true&connection_limit=5
      PGBOUNCER_ENABLED: 'true'
      DATABASE_CONNECTION_LIMIT: 5
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: 6379
      ENABLE_WORKERS: 'true'
      ENABLE_SWAGGER: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
    depends_on:
      - pgbouncer
      - redis-cache
      - redis-queue

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis_queue_data:
